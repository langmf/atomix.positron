<!DOCTYPE html>
<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	
	<link  href="css/bootstrap.min.css" type="text/css" rel="stylesheet" />
	<script src="js/bootstrap.bundle.min.js"></script>

	<script src="js/jquery.min.js"></script>
	<script src="js/atv.js"></script>

	<link  href="css/base.css" type="text/css" rel="stylesheet" />
	<script src="js/base.js"></script>
</head>

<body class="p-3">


<div class="row gap-3">
	<div class="col-auto my-3 px-2" style="min-width: fit-content;">
		<div class="card">
			<div class="card-header bg-hdr text-center">Tools</div>
			<div class="card-body"><ol id="card_tools" class="list-group"></ol></div>
		</div>
	</div>
</div>


<script>
	$(async () => {
		await URI.ready

		$('#card_tools').html('Update ... Please wait.')

		const list = await vscode_Eval().root.exeList(URI.path.pds + 'Plugin', '\.(mf|cmd|exe|lnk)$')
		const prf  = parse_ExeIcon()

		$('#card_tools').html('')

		const allow = ["Serial Communicator", "ASCII Table", "Virtual Hardware Board Explorer"]

		const files = list.filter(x => {
			const f = x.info || {};
			if (f.CompanyName === 'Mecanique' && !allow.includes(f.FileDescription)) return
			if (f.FileDescription === 'PDS Fuse Configurator Plugin.') return
			if (/[\/\\]pk3cmd\.exe$/i.test(x.name)) return
			return true
		})
		
		for (const x of files) {
			const f    = x.info
			const ver  = f.FileVersion.replace(/(?<=\.)((0)0+(?=\.|$)|0{2,}(?=[^0]|$))/g, '$2')
			const icon = `<img id="${prf + x.id}" src="${x.icon ? URI.parse(x.icon) : ''}" class="icon-32 icon-none mx-1 my-auto">`

			$('#card_tools').append(
				`<li class="list-group-item d-flex justify-content-between align-items-start" onclick="openURL('${URI.file(x.name)}')">
					<div style="display: flex;">
						${icon}
						<div class="ms-3 me-4">
							<div class="fw-bold"><a href="#">${f.FileDescription || f.ProductName}</a></div>
							<div style="font-size: 0.8rem;">${f.CompanyName}</div>
						</div>
					</div>
					<span class="badge bg-lnk rounded-pill my-auto" style="filter: brightness(90%)" data-bs-toggle="tooltip"
					data-bs-placement="right" title="${x.date}">${ver}</span>	
				</li>`
			)

			parse_ExeIcon(x)
		}

		parse_ALL()
	})
</script>


</body>
</html>
